<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Pokémon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="encabezado">
        <h1>Pokédex</h1>
        <p>Busca un Pokémon por nombre o por número</p>
    </header>

    <form id="formulario" class="buscador">
        <input type="text" id="buscar" placeholder="Ej: pikachu o 25" required>
        <button type="submit">Buscar</button>
    </form>

    <main id="resultado">
        <p class="mensaje">Escribe un nombre o un número para empezar 🔎</p>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
